<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Font Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='get_vector.css')}}">
</head>
<body>

<div class="main-wrapper">

    <div class="card app-card shadow-lg">

        <h1 class="title">🔍 Font Finder</h1>

        <form action="/upload" method="POST" enctype="multipart/form-data">
            
            <label for="fileInput" class="upload-box">
                <div class="upload-content">
                    <p>Перетащите изображение сюда</p>
                    <span>или нажмите для выбора</span>
                </div>
                <input type="file" name="photo" id="fileInput" hidden required>
            </label>

            <button type="submit" class="btn btn-gradient">
                Найти шрифт
            </button>
            <div id="previewContainer" class="uploaded-section" style="display:none;">
                    <p class="file-name">📎 Выбранное изображение</p>

                    <div class="uploaded-full">
                        <img id="previewImage">
                    </div>
                </div>
        </form>

        {% if uploaded_image %}
        <div class="uploaded-section" id="uploadedImageSection">
            <p class="file-name">📎 {{ filename }}</p>

            <div class="uploaded-full">
                <img src="data:image/png;base64,{{ uploaded_image }}">
            </div>
        </div>
        {% endif %}

        {% if fonts %}
        <div class="results-section" id="resultsSection">
            <h3 class="results-title">Похожие шрифты</h3>

            {% for font in fonts %}
            <div class="font-result">

                <div class="font-preview-full">
                    <img src="data:image/png;base64,{{ font.image }}">
                </div>

                <div class="font-meta">
                    <div class="font-left">
                        <h4 class="font-name">{{ font.name }}</h4>
                    </div>
                    <div class="font-right">
                        <span class="similarity">
                            Similarity {{ "%.2f"|format(font.sim * 100) }}%
                        </span>
                    </div>
                </div>

            </div>
            {% endfor %}
        </div>
        {% endif %}

    </div>
</div>

</body>
<script>

const fileInput = document.getElementById("fileInput");
const previewImage = document.getElementById("previewImage");
const previewContainer = document.getElementById("previewContainer");

fileInput.addEventListener("change", function(){

    const file = this.files[0];

    if(file){

        const results = document.getElementById("resultsSection");
        if(results){
            results.style.display = "none";
        }

        const uploaded = document.getElementById("uploadedImageSection");
        if(uploaded){
            uploaded.style.display = "none";
        }

        const reader = new FileReader();

        reader.onload = function(e){
            previewImage.src = e.target.result;
            previewContainer.style.display = "block";
        }

        reader.readAsDataURL(file);
    }

});

</script>
</html>
